resources:
  jobs:
    openings_research:
      name: openings-research-${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: opening
          default: Italian Game
        - name: mode
          default: refresh
        - name: source_run_id
          default: ''
        - name: agent
          default: openai
        - name: model
          default: gpt-4.1-mini
      tasks:
        - task_key: collect
          environment_key: research
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: openings_researcher
            entry_point: collect
            named_parameters: &parameters
              catalog: ${var.catalog}
              schema: ${var.schema}
              secret-scope: ${var.secret_scope}
              code-version: ${var.code_version}
              run-id: '{{job.run_id}}'
              opening: '{{job.parameters.opening}}'
              mode: '{{job.parameters.mode}}'
              source-run-id: '{{job.parameters.source_run_id}}'
              agent: '{{job.parameters.agent}}'
              model: '{{job.parameters.model}}'
        - task_key: extract
          depends_on:
            - task_key: collect
          environment_key: research
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: openings_researcher
            entry_point: extract
            named_parameters: *parameters
        - task_key: validate
          depends_on:
            - task_key: extract
          environment_key: research
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: openings_researcher
            entry_point: validate
            named_parameters: *parameters
        - task_key: publish
          depends_on:
            - task_key: validate
          environment_key: research
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: openings_researcher
            entry_point: publish
            named_parameters: *parameters
      environments:
        - environment_key: research
          spec:
            environment_version: '4'
            dependencies:
              - ../dist/*.whl
